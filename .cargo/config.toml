# Build settings for faster dev builds and a smaller target/ dir.
# These live here, not in Cargo.toml, so they apply to every crate in the workspace.

# rust-lld (shipped with the Rust toolchain) links large Windows binaries much
# faster than MSVC link.exe. If linking ever fails with it, delete these two lines
# to fall back to link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Full debug info made target/debug grow past 50 GB and slowed every link.
# Line tables keep file:line in panics and backtraces. Dependencies carry none.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# whisper-rs (crates/stt) needs libclang for bindgen. This is the default LLVM
# install path (`winget install LLVM.LLVM`); a LIBCLANG_PATH you set yourself wins.
[env]
LIBCLANG_PATH = { value = 'C:\Program Files\LLVM\bin', force = false }
# whisper-rs-sys builds whisper.cpp as RelWithDebInfo in dev, which on MSVC limits
# inlining (/Ob1) and makes ggml several times slower. Build it as Release always.
CMAKE_BUILD_TYPE = { value = "Release", force = false }
