[package]
name = "sleuth-service"
description = "Application service layer: the single API used by the UI, MCP and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sleuth_service"

[dependencies]
sleuth-core.workspace = true
sleuth-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
image.workspace = true
rayon.workspace = true
arboard.workspace = true
sleuth-legacy.workspace = true
sleuth-pdf.workspace = true
sleuth-stt.workspace = true
fastrand.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
sleuth-legacy = { workspace = true, features = ["fixture"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[bench]]
name = "perf"
harness = false
