[package]
name = "sloth-service"
description = "Application service layer: the single API used by the UI, MCP and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sloth_service"

[dependencies]
sloth-core.workspace = true
sloth-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
image.workspace = true
rayon.workspace = true
arboard.workspace = true
sloth-legacy.workspace = true
sloth-pdf.workspace = true
sloth-stt.workspace = true
fastrand.workspace = true
base64.workspace = true
reqwest = { version = "0.13", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["std"] }
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile.workspace = true
sloth-legacy = { workspace = true, features = ["fixture"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[bench]]
name = "perf"
harness = false
