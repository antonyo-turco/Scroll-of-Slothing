[package]
name = "sleuth-mcp"
description = "MCP server exposing the Scroll of Sleuthing service layer as tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sleuth_mcp"

[[bin]]
name = "sleuth-mcp"
path = "src/main.rs"

[dependencies]
sleuth-core.workspace = true
sleuth-service.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }
tempfile.workspace = true
image.workspace = true

[lints]
workspace = true
