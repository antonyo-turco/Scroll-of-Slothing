[package]
name = "sleuth-mcp"
description = "MCP server exposing the Scroll of Sleuthing service layer as tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sleuth_mcp"

[[bin]]
name = "sleuth-mcp"
path = "src/main.rs"

[dependencies]
sleuth-core.workspace = true
sleuth-service.workspace = true
rmcp = { version = "3", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio", "http1", "http2"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["server", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
uuid.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
base64 = "0.22"

[dev-dependencies]
rmcp = { version = "3", features = ["client"] }
tempfile.workspace = true
image.workspace = true

[lints]
workspace = true
